name: Release

on:
  # Manual-only. Releases use plain-semver tags (v0.1.1, v0.1.2, ...)
  # from v0.1.1 onward and are published via `gh release create`; this
  # signed-release + WinGet/Scoop pipeline still needs signing secrets
  # and package-manager vars that are not configured, so a tag-push
  # trigger would only produce a guaranteed-failing run per release.
  # Re-add a tags trigger when the signing/distribution secrets exist.
  workflow_dispatch:
    inputs:
      version:
        description: Release version to package, without a leading v. Use the Paramux release scheme such as 1.3.100
        required: true
        type: string
      prerelease:
        description: Publish the manual build as a prerelease
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    name: Windows Release
    runs-on: windows-latest
    environment: release
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      WINGET_PACKAGE_IDENTIFIER: ${{ vars.WINGET_PACKAGE_IDENTIFIER }}
      SCOOP_BUCKET_REPO: ${{ vars.SCOOP_BUCKET_REPO }}
      SCOOP_BUCKET_BRANCH: ${{ vars.SCOOP_BUCKET_BRANCH }}
      SCOOP_BUCKET_MANIFEST_PATH: ${{ vars.SCOOP_BUCKET_MANIFEST_PATH }}
      WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
      WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
      WINDOWS_CODESIGN_TIMESTAMP_URL: ${{ vars.WINDOWS_CODESIGN_TIMESTAMP_URL }}
      WINDOWS_CODESIGN_TRUST_SELF_SIGNED: ${{ vars.WINDOWS_CODESIGN_TRUST_SELF_SIGNED }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve release metadata
        id: meta
        env:
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_INPUT_VERSION: ${{ inputs.version }}
          RELEASE_INPUT_PRERELEASE: ${{ inputs.prerelease }}
        shell: pwsh
        run: |
          if ($env:RELEASE_EVENT_NAME -eq "push") {
            $tag = $env:RELEASE_REF_NAME
            $version = $tag.TrimStart('v')
            $prerelease = "false"
          } else {
            $version = $env:RELEASE_INPUT_VERSION
            $tag = "v$version"
            $prerelease = $env:RELEASE_INPUT_PRERELEASE
          }

          $versionMatch = [regex]::Match($version, '^(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$')
          if (-not $versionMatch.Success) {
            throw "Unsupported release version format '$version'. Paramux releases must use plain semver <major>.<minor>.<patch>."
          }

          $releaseMetaPath = Join-Path $PWD "dist/windows/release-metadata.json"
          if (-not (Test-Path -LiteralPath $releaseMetaPath)) {
            throw "Release metadata file not found: $releaseMetaPath"
          }

          $releaseMeta = Get-Content -LiteralPath $releaseMetaPath -Raw | ConvertFrom-Json
          $upstreamBaseVersion = [string]$releaseMeta.upstreamBaseVersion
          $firstForkPatch = [int]$releaseMeta.firstForkPatch
          $upstreamMatch = [regex]::Match($upstreamBaseVersion, '^(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$')
          if (-not $upstreamMatch.Success) {
            throw "dist/windows/release-metadata.json must declare a plain semver upstreamBaseVersion."
          }

          $versionLine = "$($versionMatch.Groups['major'].Value).$($versionMatch.Groups['minor'].Value)"
          $upstreamLine = "$($upstreamMatch.Groups['major'].Value).$($upstreamMatch.Groups['minor'].Value)"
          if ($versionLine -ne $upstreamLine) {
            throw "Release version '$version' is on line $versionLine but upstreamBaseVersion '$upstreamBaseVersion' is on line $upstreamLine."
          }

          $patch = [int]$versionMatch.Groups['patch'].Value
          if ($patch -lt $firstForkPatch) {
            throw "Release patch '$patch' is below the configured firstForkPatch '$firstForkPatch'. Paramux releases on line $versionLine must start at $versionLine.$firstForkPatch or later."
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
          "title=Paramux $version" >> $env:GITHUB_OUTPUT
          "version_line=$versionLine" >> $env:GITHUB_OUTPUT
          "upstream_base_version=$upstreamBaseVersion" >> $env:GITHUB_OUTPUT
          "first_fork_patch=$firstForkPatch" >> $env:GITHUB_OUTPUT

      - name: Release preflight
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          WINGETCREATE_TOKEN: ${{ secrets.WINGETCREATE_TOKEN }}
        shell: pwsh
        run: |
          $scriptArgs = @(
            "-ExecutionPolicy", "Bypass",
            "-File", "scripts/release-preflight.ps1",
            "-Version", $env:RELEASE_VERSION,
            "-RequireSigning"
          )
          & powershell @scriptArgs
          if ($LASTEXITCODE -ne 0) {
            throw "Release preflight failed with exit code $LASTEXITCODE."
          }

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Run targeted tests
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          zig build test -Dtest-filter=win32
          zig build test -Dtest-filter=scroll
          zig build test -Dtest-filter=keybind

      - name: Build and package x64 release artifacts
        shell: pwsh
        timeout-minutes: 35
        run: >
          ./scripts/build-package-windows.ps1
          -Version ${{ steps.meta.outputs.version }}
          -Architecture x64
          -Optimize ReleaseFast
          -RequireInstaller
          -RequireSigning

      - name: Build and package ARM64 release artifacts
        shell: pwsh
        timeout-minutes: 35
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}\.zig-global-cache
        run: >
          ./scripts/build-package-windows.ps1
          -Version ${{ steps.meta.outputs.version }}
          -Architecture arm64
          -Optimize ReleaseFast
          -RequireInstaller
          -RequireSigning

      - name: Verify signed release artifacts
        shell: pwsh
        run: |
          . (Join-Path $PWD "scripts/windows-architecture.ps1")
          $version = "${{ steps.meta.outputs.version }}"
          $trustSelfSigned = "${{ env.WINDOWS_CODESIGN_TRUST_SELF_SIGNED }}".Trim().ToLowerInvariant() -in @("true", "1", "yes", "on")
          function Test-SelfSignedTrustStatus {
            param([System.Management.Automation.Signature]$Signature)

            if ($Signature.Status -eq [System.Management.Automation.SignatureStatus]::Valid) {
              return $true
            }

            if ($Signature.Status -eq [System.Management.Automation.SignatureStatus]::NotTrusted) {
              return $true
            }

            if ($Signature.Status -ne [System.Management.Automation.SignatureStatus]::UnknownError) {
              return $false
            }

            $message = if ($Signature.StatusMessage) { $Signature.StatusMessage } else { "" }
            return $message -match "root certificate.*not trusted|self-signed|not trusted by the trust provider"
          }

          function Assert-ReleaseSignature {
            param(
              [string]$Path,
              [string]$Label
            )

            $sig = Get-AuthenticodeSignature -LiteralPath $Path
            if ($sig.Status -eq [System.Management.Automation.SignatureStatus]::Valid) {
              return
            }

            if ($trustSelfSigned -and
                $sig.SignerCertificate -and
                $sig.SignerCertificate.Subject -eq $sig.SignerCertificate.Issuer -and
                (Test-SelfSignedTrustStatus -Signature $sig)) {
              return
            }

            throw "$Label Authenticode signature is not valid: $($sig.Status) $($sig.StatusMessage)"
          }

          foreach ($arch in (Get-WindowsPackageArchitectures)) {
            $artifactDir = Join-Path $PWD "dist/artifacts/paramux-$version-windows-$arch"
            $setup = Join-Path $artifactDir (New-WindowsPackageArtifactName -Version $version -Architecture $arch -Kind setup)
            $zip = Join-Path $artifactDir (New-WindowsPackageArtifactName -Version $version -Architecture $arch -Kind portable)
            $checksums = Join-Path $artifactDir (New-WindowsPackageArtifactName -Version $version -Architecture $arch -Kind checksums)
            foreach ($path in @($setup, $zip, $checksums)) {
              if (-not (Test-Path -LiteralPath $path)) {
                throw "Missing required release asset: $path"
              }
            }

            $checksumText = Get-Content -LiteralPath $checksums
            foreach ($path in @($setup, $zip)) {
              $name = [System.IO.Path]::GetFileName($path)
              $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
              if ($checksumText -notcontains "$hash *$name") {
                throw "$([System.IO.Path]::GetFileName($checksums)) does not contain the expected hash line for $name."
              }
            }

            Assert-ReleaseSignature -Path $setup -Label "Setup $arch"

            $extractDir = Join-Path $env:RUNNER_TEMP "paramux-release-verify-$arch"
            if (Test-Path -LiteralPath $extractDir) {
              Remove-Item -LiteralPath $extractDir -Recurse -Force
            }
            Expand-Archive -LiteralPath $zip -DestinationPath $extractDir
            foreach ($relative in @("paramux/paramux.com", "paramux/paramux.exe", "paramux/ghostty-vt.dll")) {
              $path = Join-Path $extractDir $relative
              Assert-ReleaseSignature -Path $path -Label "$relative $arch"
            }
          }

      - name: Generate package manager metadata
        shell: pwsh
        run: >
          ./scripts/package-package-managers.ps1
          -Version ${{ steps.meta.outputs.version }}
          -Tag ${{ steps.meta.outputs.tag }}
          -Repo ${{ github.repository }}
          -Architectures @("x64", "arm64")
          -UpstreamBaseVersion ${{ steps.meta.outputs.upstream_base_version }}
          -FirstForkPatch ${{ steps.meta.outputs.first_fork_patch }}
          -WingetPackageIdentifier $env:WINGET_PACKAGE_IDENTIFIER

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          . (Join-Path $PWD "scripts/windows-architecture.ps1")
          $tag = "${{ steps.meta.outputs.tag }}"
          $version = "${{ steps.meta.outputs.version }}"
          $title = "${{ steps.meta.outputs.title }}"
          $versionLine = "${{ steps.meta.outputs.version_line }}"
          $upstreamBaseVersion = "${{ steps.meta.outputs.upstream_base_version }}"
          $architectures = Get-WindowsPackageArchitectures
          $artifactDirs = @{}
          foreach ($arch in $architectures) {
            $artifactDirs[$arch] = Join-Path $PWD "dist/artifacts/paramux-$version-windows-$arch"
          }
          $artifactDirX64 = $artifactDirs["x64"]
          $legacyChecksumsPath = Join-Path $artifactDirX64 (New-WindowsPackageArtifactName -Version $version -Architecture x64 -Kind legacy-checksums)
          Copy-Item -LiteralPath (Join-Path $artifactDirX64 (New-WindowsPackageArtifactName -Version $version -Architecture x64 -Kind checksums)) -Destination $legacyChecksumsPath -Force
          $assets = @()
          foreach ($arch in $architectures) {
            $artifactDir = $artifactDirs[$arch]
            $assets += @(
              (Join-Path $artifactDir (New-WindowsPackageArtifactName -Version $version -Architecture $arch -Kind setup)),
              (Join-Path $artifactDir (New-WindowsPackageArtifactName -Version $version -Architecture $arch -Kind portable)),
              (Join-Path $artifactDir (New-WindowsPackageArtifactName -Version $version -Architecture $arch -Kind checksums))
            )
          }
          $assets += @(
            $legacyChecksumsPath,
            (Join-Path $artifactDirX64 "paramux-icon.svg")
          )
          $notesPrefix = @"
          Compatibility line: Ghostty $versionLine
          Base upstream release: $upstreamBaseVersion
          Versioning: major.minor follow the Ghostty upstream line; patch is the Paramux release number on that line.
          "@

          & gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            $extra = @()
            if ("${{ steps.meta.outputs.prerelease }}" -eq "true") {
              $extra += "--prerelease"
            }
            & gh release create $tag --target $env:GITHUB_SHA --title $title --generate-notes --notes $notesPrefix @extra @assets
            if ($LASTEXITCODE -ne 0) {
              throw "gh release create failed with exit code $LASTEXITCODE"
            }
          } else {
            $releaseTarget = & gh api "repos/$env:GITHUB_REPOSITORY/commits/$tag" --jq ".sha"
            if ($LASTEXITCODE -ne 0) {
              throw "Could not resolve existing release tag $tag."
            }
            $releaseTarget = ([string] $releaseTarget).Trim()
            if ($releaseTarget -ne $env:GITHUB_SHA) {
              throw "Existing release $tag points at $releaseTarget, not packaged commit $env:GITHUB_SHA."
            }
            & gh release edit $tag --title $title
            if ($LASTEXITCODE -ne 0) {
              throw "gh release edit failed with exit code $LASTEXITCODE"
            }
            & gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "gh release upload failed with exit code $LASTEXITCODE"
            }
          }

      - name: Publish Scoop manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) {
            Write-Host "Skipping Scoop publish: SCOOP_BUCKET_TOKEN is not configured."
            return
          }

          if (-not $env:SCOOP_BUCKET_REPO) {
            Write-Host "Skipping Scoop publish: SCOOP_BUCKET_REPO is not configured."
            return
          }

          $version = "${{ steps.meta.outputs.version }}"
          $artifactDirX64 = Join-Path $PWD "dist/artifacts/paramux-$version-windows-x64"
          $metadataPath = Join-Path $artifactDirX64 "package-managers/metadata.json"
          $metadata = Get-Content -LiteralPath $metadataPath -Raw | ConvertFrom-Json
          $manifestRelPath = if ($env:SCOOP_BUCKET_MANIFEST_PATH) {
            $env:SCOOP_BUCKET_MANIFEST_PATH
          } else {
            "bucket/paramux.json"
          }

          $bucketDir = Join-Path $env:RUNNER_TEMP "paramux-scoop-bucket"
          if (Test-Path -LiteralPath $bucketDir) {
            Remove-Item -LiteralPath $bucketDir -Recurse -Force
          }

          $cloneArgs = @("repo", "clone", $env:SCOOP_BUCKET_REPO, $bucketDir, "--", "--depth", "1")
          if ($env:SCOOP_BUCKET_BRANCH) {
            $cloneArgs += @("--branch", $env:SCOOP_BUCKET_BRANCH)
          }
          & gh @cloneArgs
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to clone Scoop bucket repo $($env:SCOOP_BUCKET_REPO)."
          }

          $destManifestPath = Join-Path $bucketDir $manifestRelPath
          $destManifestDir = Split-Path -Parent $destManifestPath
          New-Item -ItemType Directory -Path $destManifestDir -Force | Out-Null
          Copy-Item -LiteralPath $metadata.scoop.manifestPath -Destination $destManifestPath -Force

          Push-Location $bucketDir
          try {
            & git remote set-url origin "https://x-access-token:$env:GH_TOKEN@github.com/$($env:SCOOP_BUCKET_REPO).git"
            if ($LASTEXITCODE -ne 0) {
              throw "git remote set-url failed with exit code $LASTEXITCODE"
            }

            & git config user.name "github-actions[bot]"
            if ($LASTEXITCODE -ne 0) {
              throw "git config user.name failed with exit code $LASTEXITCODE"
            }
            & git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if ($LASTEXITCODE -ne 0) {
              throw "git config user.email failed with exit code $LASTEXITCODE"
            }
            & git add -- $manifestRelPath
            if ($LASTEXITCODE -ne 0) {
              throw "git add failed with exit code $LASTEXITCODE"
            }
            & git diff --cached --quiet --exit-code
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Scoop manifest is unchanged; skipping push."
              return
            }
            if ($LASTEXITCODE -ne 1) {
              throw "git diff --cached failed with exit code $LASTEXITCODE"
            }

            & git commit -m "paramux: update to $version"
            if ($LASTEXITCODE -ne 0) {
              throw "git commit failed with exit code $LASTEXITCODE"
            }

            & git push origin HEAD
            if ($LASTEXITCODE -ne 0) {
              throw "git push failed with exit code $LASTEXITCODE"
            }
          }
          finally {
            Pop-Location
          }

      - name: Submit WinGet manifest update
        shell: pwsh
        env:
          WINGETCREATE_TOKEN: ${{ secrets.WINGETCREATE_TOKEN }}
        run: |
          if (-not $env:WINGETCREATE_TOKEN) {
            Write-Host "Skipping WinGet submit: WINGETCREATE_TOKEN is not configured."
            return
          }

          if (-not $env:WINGET_PACKAGE_IDENTIFIER) {
            Write-Host "Skipping WinGet submit: WINGET_PACKAGE_IDENTIFIER is not configured. Initial WinGet bootstrap is still manual."
            return
          }

          $version = "${{ steps.meta.outputs.version }}"
          $artifactDirX64 = Join-Path $PWD "dist/artifacts/paramux-$version-windows-x64"
          $metadataPath = Join-Path $artifactDirX64 "package-managers/metadata.json"
          $metadata = Get-Content -LiteralPath $metadataPath -Raw | ConvertFrom-Json
          $packageIdSegments = $env:WINGET_PACKAGE_IDENTIFIER.Split('.')
          $manifestPath = "manifests/{0}/{1}" -f `
            $packageIdSegments[0].Substring(0, 1).ToLowerInvariant(), `
            ($packageIdSegments -join '/')
          $manifestApiUrl = "https://api.github.com/repos/microsoft/winget-pkgs/contents/$manifestPath"

          try {
            Invoke-WebRequest `
              -Uri $manifestApiUrl `
              -Headers @{ "User-Agent" = "paramux-release-workflow" } `
              -ErrorAction Stop | Out-Null
          }
          catch {
            $statusCode = if ($_.Exception.Response) {
              [int]$_.Exception.Response.StatusCode
            } else {
              $null
            }

            if ($statusCode -eq 404) {
              Write-Host "Skipping WinGet submit: $($env:WINGET_PACKAGE_IDENTIFIER) is not bootstrapped in microsoft/winget-pkgs ($manifestPath)."
              return
            }

            throw
          }

          $vcLibsPath = Join-Path $env:TEMP "Microsoft.VCLibs.x64.14.00.Desktop.appx"
          $bundlePath = Join-Path $env:TEMP "wingetcreate.msixbundle"
          Import-Module Appx -UseWindowsPowerShell -ErrorAction Stop
          function Install-AppxPackageIfNeeded {
            param(
              [string]$Path,
              [string]$Label
            )

            try {
              Add-AppxPackage -Path $Path -ErrorAction Stop
            }
            catch {
              $message = $_.Exception.Message
              if ($message -match "0x80073D06" -or $message -match "higher version of this package is already installed") {
                Write-Host "$Label already satisfied on this runner; skipping package install."
                return
              }

              throw
            }
          }

          Invoke-WebRequest -Uri "https://aka.ms/Microsoft.VCLibs.x64.14.00.Desktop.appx" -OutFile $vcLibsPath -ErrorAction Stop
          Install-AppxPackageIfNeeded -Path $vcLibsPath -Label "Microsoft.VCLibs.x64.14.00.Desktop"
          Invoke-WebRequest -Uri "https://aka.ms/wingetcreate/latest/msixbundle" -OutFile $bundlePath -ErrorAction Stop
          Install-AppxPackageIfNeeded -Path $bundlePath -Label "wingetcreate bundle"

          # wingetcreate update documents URL architecture overrides as "<url>|<arch>".
          $installerUrls = @($metadata.winget.installerUrlArgs | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) })
          if ($installerUrls.Count -eq 0) {
            $installerUrls = @($metadata.winget.installerUrls | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) })
          }
          if ($installerUrls.Count -eq 0 -and -not [string]::IsNullOrWhiteSpace([string]$metadata.winget.installerUrl)) {
            $installerUrls = @([string]$metadata.winget.installerUrl)
          }
          if ($installerUrls.Count -eq 0) {
            throw "No WinGet installer URLs were found in release metadata."
          }
          $installerUrlArgs = @($installerUrls | ForEach-Object { [string]$_ })

          function Invoke-WinGetCreateUpdate {
            param([string[]]$InstallerUrlArgs)

            $output = & wingetcreate update $env:WINGET_PACKAGE_IDENTIFIER `
              --version $version `
              --urls $InstallerUrlArgs `
              --release-notes-url $metadata.release.releaseUrl `
              --submit `
              --no-open `
              --token $env:WINGETCREATE_TOKEN 2>&1
            $exitCode = $LASTEXITCODE
            $output | ForEach-Object { Write-Host $_ }

            return @{
              ExitCode = $exitCode
              Output = (@($output) -join "`n")
            }
          }

          $result = Invoke-WinGetCreateUpdate -InstallerUrlArgs $installerUrlArgs
          if ($result.ExitCode -ne 0 -and
              $installerUrlArgs.Count -gt 1 -and
              $result.Output -match "same number of installer URLs" -and
              -not [string]::IsNullOrWhiteSpace([string]$metadata.winget.installerUrl)) {
            Write-Host "WinGet update does not support increasing installer URL count for this package yet; retrying with the primary installer URL."
            $installerUrlArgs = @([string]$metadata.winget.installerUrl)
            $result = Invoke-WinGetCreateUpdate -InstallerUrlArgs $installerUrlArgs
          }

          if ($result.ExitCode -ne 0) {
            throw "wingetcreate update failed with exit code $($result.ExitCode)"
          }
