name: Test

on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name != 'paramux' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows Build And Tests
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Package manager metadata contract
        shell: pwsh
        run: test/windows/package-package-managers.ps1

      - name: Release safety contract
        shell: pwsh
        run: test/windows/release-safety-contract.ps1

      - name: Verify generated site bundle
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci --prefix site
          npm run build --prefix site
          git diff --exit-code -- site/bundle.js

      - name: Paramux release copy contract
        shell: pwsh
        run: scripts/check-release-copy.ps1

      - name: Paramux site copy contract
        shell: pwsh
        run: scripts/check-site-copy.ps1

      - name: Agent hook adapter contract
        shell: pwsh
        run: test/agent-hook-adapters.ps1

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Zig version
        run: zig version

      - name: Win32 tests
        run: zig build test -Dtest-filter=win32

      - name: Scroll tests
        run: zig build test -Dtest-filter=scroll

      - name: Keybind tests
        run: zig build test -Dtest-filter=keybind

      - name: Paramux regression tests
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          zig build test -Dtest-filter=paramux
          zig build test -Dtest-filter=branding
          zig build test -Dtest-filter=automation-input
          zig build test -Dtest-filter=send

      - name: Build
        run: zig build

      - name: Build release package inputs
        # Flags must stay in sync with scripts/build-package-windows.ps1: the
        # packaging step below runs check-windows-x64-baseline.ps1, whose
        # correctness premise is a -Dcpu=baseline build.
        run: zig build -Demit-exe=true -Demit-lib-vt=true -Doptimize=ReleaseFast -Dtarget=x86_64-windows-msvc -Dcpu=baseline "-Dversion-string=0.0.1"

      - name: Package and verify x64 portable build
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          scripts/package-windows.ps1 -Version 0.0.1 -Architecture x64 -SkipBuild -SkipInstaller
          test/windows/package-portable-cli.ps1 -Version 0.0.1 -Architecture x64 -SkipPackage

      - name: Perf budget (CLI cold start)
        shell: pwsh
        # ReleaseFast build from the step above; 250ms is ~6x the local
        # average — a genuine regression gate, not a flaky race.
        run: scripts/bench-startup.ps1 -CliOnly -MaxCliMs 250

      - name: Build ARM64 executable
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}\.zig-global-cache
        # Cross-compilation coverage only; native execution runs in windows-arm64.yml.
        run: zig build -Demit-exe=true -Dtarget=aarch64-windows-msvc -Dcpu=baseline
