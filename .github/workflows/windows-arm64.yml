name: Windows ARM64

on:
  push:
    branches:
      - paramux
  pull_request: {}
  workflow_dispatch:
    inputs:
      version:
        description: "Version string for the packaged artifact (e.g. 0.1.6)"
        required: false
        default: "0.0.1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name != 'paramux' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  native-arm64:
    name: Native Windows ARM64 Tests
    runs-on: windows-11-arm
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      PARAMUX_CI_VERSION: ${{ inputs.version || '0.0.1' }}
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}\.zig-global-cache

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Fetch dependencies (retried)
        shell: pwsh
        # Same CDN-fault absorber as test.yml.
        run: |
          $ok = $false
          foreach ($i in 1..3) {
            zig build --fetch
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "fetch attempt $i failed; sleeping 30s"
            Start-Sleep -Seconds 30
          }
          if (-not $ok) { throw "dependency fetch failed after 3 attempts" }

      - name: Verify native ARM64 runner
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          Write-Host "PROCESSOR_ARCHITEW6432=$env:PROCESSOR_ARCHITEW6432"
          Write-Host "Process architecture=$([System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture)"
          zig version
          zig env

          if ($env:PROCESSOR_ARCHITECTURE -ne "ARM64") {
            throw "Expected a native Windows ARM64 runner, got PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE."
          }

      - name: Run ARM64 Zig tests
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          zig build test -Dtest-filter=win32 -Dtarget=aarch64-windows-msvc -Dcpu=baseline
          zig build test -Dtest-filter=scroll -Dtarget=aarch64-windows-msvc -Dcpu=baseline
          zig build test -Dtest-filter=keybind -Dtarget=aarch64-windows-msvc -Dcpu=baseline
          zig build test -Dtest-filter=release -Dtarget=aarch64-windows-msvc -Dcpu=baseline

      - name: Build and package ARM64 binaries
        shell: pwsh
        timeout-minutes: 20
        run: >
          ./scripts/build-package-windows.ps1
          -Version $env:PARAMUX_CI_VERSION
          -Architecture arm64

      - name: Run ARM64 CLI smoke
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $versionText = & .\zig-out\bin\paramux.com +version | Out-String
          Write-Host $versionText
          if ($versionText -notmatch "Build Config") {
            throw "paramux.com +version did not print the expected version output."
          }

      - name: Run packaged ARM64 CLI smoke
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $portableRoot = Join-Path $PWD "dist/artifacts/paramux-$env:PARAMUX_CI_VERSION-windows-arm64/paramux"
          $portableCommand = Join-Path $portableRoot "paramux.com"
          if (-not (Test-Path -LiteralPath $portableCommand)) {
            throw "Missing packaged ARM64 command shim: $portableCommand"
          }

          $versionText = & $portableCommand +version | Out-String
          Write-Host $versionText
          if ($versionText -notmatch "Build Config") {
            throw "Packaged paramux.com +version did not print the expected version output."
          }

          $themesText = & $portableCommand +list-themes | Out-String
          if ($themesText -notmatch "0x96f") {
            throw "Packaged ARM64 +list-themes did not find packaged resources."
          }

      - name: Upload ARM64 portable artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paramux-${{ env.PARAMUX_CI_VERSION }}-windows-arm64
          path: |
            dist/artifacts/paramux-${{ env.PARAMUX_CI_VERSION }}-windows-arm64/paramux-${{ env.PARAMUX_CI_VERSION }}-windows-arm64-portable.zip
            dist/artifacts/paramux-${{ env.PARAMUX_CI_VERSION }}-windows-arm64/SHA256SUMS-windows-arm64.txt
          if-no-files-found: error
          retention-days: 14
