# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  poem: false
  sequence_diagrams: false
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
  path_filters:
    - "!zig-out/**"
    - "!.zig-cache/**"
    - "!site/bundle.js"
    - "!site/package-lock.json"
    - "!site/icons/**/*.png"
    - "!dist/windows/**/*.zip"
    - "!dist/windows/**/*.msix"
    - "!dist/windows/**/*.png"
    - "!dist/windows/**/*.ico"
  path_instructions:
    - path: "site/**/*.jsx"
      instructions: |
        The static marketing site intentionally loads React and ReactDOM as UMD globals from site/vendor via site/index.html, then bundles only first-party JSX into site/bundle.js. Review source JSX rather than generated bundle output, and do not require ESM React imports unless the runtime loading model changes.
    - path: "site/index.html"
      instructions: |
        Google Fonts and manual bundle/style query-string cache busting are intentional for the static Cloudflare Pages deploy. Flag them only when the referenced assets or cache-bust values are stale or broken.
    - path: "site/components/release/**"
      instructions: |
        Review install copy against the current Paramux distribution contract: private unsigned x64 portable prerelease v0.1.0-paramux.4 with install-paramux.cmd. Flag any claim that a signed installer, WinGet, Scoop, ARM64, or a public stable channel is already available.
    - path: "site/components/hero/release-chip.jsx"
      instructions: |
        The Paramux repository and current release are private. Never suggest embedding GitHub tokens in browser code, and flag claims that an unauthenticated client-side request can discover the private prerelease.
    - path: "site/components/heroes.jsx"
      instructions: |
        Keep the release CTA pinned to the explicitly documented private prerelease tag; do not switch it to releases/latest or a public-download claim.
    - path: "site/components/why/product-facts.jsx"
      instructions: |
        Keep current shipped capabilities separate from planned signing, installer, ARM64, WinGet, Scoop, and public-release work.
    - path: "**/*.zig"
      instructions: |
        This repository is Paramux, a native Windows terminal derived from Winghostty and Ghostty. Review against soldforaloss/paramux, not either predecessor repository. Keep upstream Ghostty names only where they identify retained protocols, resources, or libghostty-vt. Do not suggest reintroducing the removed macos/ Xcode app or src/apprt/gtk runtime. Prefer minimal Zig changes, targeted `zig build test -Dtest-filter=<name>` validation, and `zig fmt` on touched Zig files.
    - path: "src/apprt/win32*.zig"
      instructions: |
        Win32 UI fixes should preserve child HWND invalidation, split-pane focus tracking, and repaint coalescing semantics documented in AGENTS.md. Flag stale paint, lifetime, and message-ordering regressions over stylistic nits.
  tools:
    github-checks:
      enabled: true
      timeout_ms: 900000
    yamllint:
      enabled: true

chat:
  auto_reply: true
